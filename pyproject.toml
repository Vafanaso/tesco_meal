[project]
name = "tesco-meal"
version = "0.1.0"
description = "Telegram bot that turns a budget into a Tesco-priced shopping list and meal plan via OpenAI and SerpAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "google-search-results>=2.4.2",
    "openai>=2.9.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "black>=25.12.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
